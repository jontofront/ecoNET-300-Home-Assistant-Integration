name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}, ${{ matrix.ha-spec }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Home Assistant, keep in sync with requirements.txt.
          - python-version: "3.13"
            ha-spec: "homeassistant==2025.6.3"
          # Newest Home Assistant release.
          - python-version: "3.14"
            ha-spec: "homeassistant"

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_test.txt "${{ matrix.ha-spec }}"

    - name: Show Home Assistant version
      run: |
        python -c "from homeassistant.const import __version__; print(__version__)"

    - name: Run tests
      run: |
        python -m pytest tests/ -v

    - name: Lint with Ruff
      run: |
        ruff check custom_components/

    - name: Format check with Ruff
      run: |
        ruff format --check custom_components/

    - name: Check translations
      run: |
        python scripts/check_translations.py
